name: Release
# Every push to main becomes a release that installed apps update to.
# Installers go to the public releases repo so friends need no GitHub access.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push supersedes a release that is still building.
  group: release
  cancel-in-progress: true
env:
  RELEASES_REPO: lubomirmolin/relay-releases
jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # major.minor from package.json, patch from the run number (stable across re-runs).
        run: echo "version=$(node -p 'require("./package.json").version.split(".").slice(0,2).join(".")').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Flagged, not blocking: a formatting slip shouldn't hold back a release.
      # Branches run the same check strictly in checks.yml.
      - run: npm run format:check
        continue-on-error: true
      - run: npm run build
      - run: npm run test:setup
      - run: npm test
      - run: python3 -m unittest discover -s tests/packaging -v

  # The builds upload straight to a draft release, not through artifact
  # storage: each release is ~600 MB and filled the account's quota. Nobody
  # sees a draft until publish makes it public.
  draft:
    needs: [version, test]
    runs-on: ubuntu-22.04
    steps:
      - name: Open a draft release in ${{ env.RELEASES_REPO }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$RELEASES_REPO" --draft \
              --title "Relay $VERSION" --notes ""

  build:
    needs: [version, draft]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            name: mac
            package: npx electron-builder --mac --publish never
            files: |
              release/*.zip
              release/*.dmg
          - os: windows-latest
            name: windows
            package: npx electron-builder --win --publish never
            files: release/*.exe
          - os: ubuntu-22.04
            name: linux
            package: npx electron-builder --linux AppImage dir --x64 --publish never && python3 scripts/package-omarchy.py
            files: |
              release/*.AppImage
              release/Relay-*-omarchy-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Windows-specific tests
        if: runner.os == 'Windows'
        run: npx vitest run tests/unit/platform.test.ts tests/unit/terminal.test.ts
      - name: Package
        run: ${{ matrix.package }}
        shell: bash
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
          FILES: ${{ matrix.files }}
        # FILES stays unquoted so each pattern expands; one matching nothing fails.
        run: |
          shopt -s failglob
          gh release upload "$TAG" $FILES --repo "$RELEASES_REPO" --clobber

  # The phone app, sideloaded from the QR code in Settings → Phone. Signed
  # with Relay's own key: Android only installs updates signed like the app.
  android:
    needs: [version, draft]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build the APK
        env:
          RELAY_VERSION: ${{ needs.version.outputs.version }}
          RELAY_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAY_ANDROID_KEY_ALIAS: relay
        run: |
          export RELAY_ANDROID_KEYSTORE="$RUNNER_TEMP/relay-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RELAY_ANDROID_KEYSTORE"
          CI=1 npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --console=plain
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk="Relay-$VERSION-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "v$VERSION" "$apk" --repo "$RELEASES_REPO" --clobber

  publish:
    needs: [version, build, android]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the builds from the draft
        run: gh release download "$TAG" --repo "$RELEASES_REPO" --dir out
      - name: Release notes
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        # The commit message without trailers like Co-Authored-By.
        run: |
          printf '%s\n' "$MESSAGE" | sed -E '/^[A-Za-z-]+: .*<[^>]*@[^>]*>$/d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
      # Unversioned aliases for .../releases/latest/download/ links.
      - run: |
          cp out/Relay-*-omarchy-x86_64.tar.gz out/Relay-Omarchy-x86_64.tar.gz
          cp out/Relay-*-android.apk out/Relay-Android.apk
      - name: Write update feed
        run: node scripts/release-manifest.mjs out "${{ needs.version.outputs.version }}" "$RELEASES_REPO" "$(cat notes.md)"
      - name: Publish to ${{ env.RELEASES_REPO }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release upload "$TAG" out/latest.json out/Relay-Omarchy-x86_64.tar.gz out/Relay-Android.apk \
            --repo "$RELEASES_REPO" --clobber
          gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false --latest \
            --title "Relay $VERSION" --notes-file notes.md
