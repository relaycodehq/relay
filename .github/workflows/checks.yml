name: Checks
# Pull requests and feature branches. Pushes to main run the same checks in release.yml.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:setup
      - run: npm test
      - run: python3 -m unittest discover -s tests/packaging -v

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libsecret-1-0 libfuse2
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - run: npm run test:setup
      # xvfb-run's default screen is 640x480 at 8 bits, smaller than the window.
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
