name: Desktop checks and builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libsecret-1-0 libfuse2
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - run: npm run test:setup
      - run: npm test
      - run: python3 -m unittest discover -s tests/packaging -v
      - name: macOS desktop integration
        if: runner.os == 'macOS'
        run: npm run test:e2e
      - name: Linux desktop integration
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run package:mac
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          npm run package:linux
          python3 scripts/package-omarchy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-relay-${{ matrix.os }}
          path: |
            release/
            test-results/screenshots/
          if-no-files-found: ignore
