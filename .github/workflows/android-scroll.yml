name: Android scroll regression
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-scroll.yml']
  push:
    paths: ['android/**', '.github/workflows/android-scroll.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-scroll-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2
          script: android/scripts/test-scroll.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-scroll-results
          path: |
            android/app/build/reports/tests/
            android/app/build/scroll-test-results.txt
          retention-days: 7
