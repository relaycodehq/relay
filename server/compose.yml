services:
  rooms:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      RELAY_ROOMS_GITEA_SERVERS: ${RELAY_ROOMS_GITEA_SERVERS:?Set trusted Gitea base URLs, separated by commas}
    ports:
      - "127.0.0.1:4319:4319"
    volumes:
      - rooms:/data
    secrets:
      - setup_key
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4319/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  setup_key:
    file: ./.secrets/setup-key.txt
volumes:
  rooms:
