# The Xcode project is generated from this: `xcodegen` in ios/.
name: Relay
# Hot reload only where it's asked for (scripts/sim.sh): linked, InjectionLite ships whatever the
# configuration, so device and release builds leave it out.
include:
  - path: hot-reload.yml
    enable: ${RELAY_HOT_RELOAD}
options:
  bundleIdPrefix: dev.relay
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  RelayKit:
    path: RelayKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set when signing for a device or TestFlight; the simulator needs none.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: Relay
      # Android's copy, one source for both: display math typesets with it.
      - path: ../android/app/src/main/assets/katex
        type: folder
        buildPhase: resources
    dependencies:
      - package: RelayKit
        product: RelayRemote
      - package: RelayKit
        product: RelayMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.relay.ios
        PRODUCT_NAME: Relay
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Relay/Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Read aloud keeps pulling and playing the computer's voice with the screen off.
        UIBackgroundModes: [audio]
        # The R the splash pulls apart (App/Splash), centred on the app's background.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        # JetBrains Mono for code, as on Android (UI/Mono.swift).
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The browser loads the computer's dev servers from the phone's own loopback, over http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Lets Spinner (UI/Spinner.swift) ask for ProMotion's 120Hz; iPhones cap Core Animation at 60 without it.
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: Relay connects to Relay on your computer over your network.
        # Pairing asks for the local network up front by finding a service of its own (Features/Pairing/ScanPermissions).
        NSBonjourServices:
          - _relay-probe._tcp
        NSCameraUsageDescription: Scan the pairing code Relay shows on your computer, and take photos to send with a message.
        NSMicrophoneUsageDescription: Dictate messages. Your computer or this phone turns the speech into text; no recording is kept.
        NSSpeechRecognitionUsageDescription: Dictate messages with this phone's own speech engine; the audio stays on the phone.
        # The desktop's QR code is a relay-remote:// link, so the Camera app opens it here too.
        CFBundleURLTypes:
          - CFBundleURLName: dev.relay.pair
            CFBundleURLSchemes:
              - relay-remote
          # relay-native://chat/<id> opens a thread, as on Android.
          - CFBundleURLName: dev.relay.native
            CFBundleURLSchemes:
              - relay-native
