plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.relay'
version = '1.0.0'

android {
  namespace "expo.modules.relaywatch"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Headless JS tasks keep React Native's timers running in the background.
  implementation 'com.facebook.react:react-android'
}
